name: Sync Hugging Face dataset card

permissions:
  contents: read

on:
  push:
    branches: [master, main]
    paths:
      - "docs/huggingface-cards/dataset-iue-edu-MaternaQA-es.md"
      - "public/app-icon.png"
      - ".github/workflows/sync-hf-dataset-card.yml"
  workflow_dispatch:

jobs:
  sync-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.36,<1.0"

      - name: Upload dataset card and icon
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          repo_id = "iue-edu/MaternaQA-es"

          from huggingface_hub import CommitOperationAdd

          operations = [
              CommitOperationAdd(
                  path_in_repo="README.md",
                  path_or_fileobj="docs/huggingface-cards/dataset-iue-edu-MaternaQA-es.md",
              ),
              CommitOperationAdd(
                  path_in_repo="app-icon.png",
                  path_or_fileobj="public/app-icon.png",
              ),
          ]

          api.create_commit(
              repo_id=repo_id,
              repo_type="dataset",
              operations=operations,
              commit_message="docs: sync dataset card from GitHub",
          )
          PY
